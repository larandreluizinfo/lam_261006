<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça ao Tesouro — Colégio Helena 🌿</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: linear-gradient(160deg, #e8f5e9 0%, #f7f5e6 55%, #fff8e1 100%);
      color: #2e4a2b;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    .wrap { width: 100%; max-width: 640px; }
    header { text-align: center; margin: 1rem 0 .5rem; }
    header h1 { margin: .25rem 0; font-size: 2rem; color: #1b5e20; }
    header .sub { margin: 0; font-weight: 600; color: #558b2f; }
    .progress {
      background: #fff;
      border: 3px solid #a5d6a7;
      border-radius: 999px;
      padding: .5rem .9rem;
      margin: 1rem 0;
    }
    .bar { height: 12px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #66bb6a, #2e7d32); transition: width .4s; }
    .letters { display: flex; gap: .4rem; justify-content: center; margin-top: .6rem; }
    .slot {
      width: 44px; height: 52px;
      display: grid; place-items: center;
      font-size: 1.5rem; font-weight: 800;
      background: #f1f8e9; border: 2px dashed #9ccc65; border-radius: 12px;
    }
    .slot.found { background: #c5e1a5; border-style: solid; border-color: #558b2f; color: #1b5e20; }
    .card {
      background: #fff;
      border: 3px solid #a5d6a7;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 6px 0 #c5e1a5;
      text-align: center;
    }
    .card h2 { margin-top: 0; color: #1b5e20; }
    .riddle { font-size: 1.15rem; line-height: 1.5; background: #f1f8e9; border-radius: 14px; padding: 1rem; }
    .counter { font-weight: 700; color: #558b2f; }
    form { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }
    input[type="text"] {
      flex: 1 1 200px;
      font-size: 1.1rem; padding: .7rem 1rem;
      border: 3px solid #a5d6a7; border-radius: 999px;
      outline: none; text-align: center;
    }
    input[type="text"]:focus { border-color: #2e7d32; }
    button {
      font-size: 1.05rem; font-weight: 700;
      padding: .7rem 1.3rem;
      border: none; border-radius: 999px;
      background: #43a047; color: #fff; cursor: pointer;
      box-shadow: 0 4px 0 #2e7d32;
    }
    button:active { transform: translateY(3px); box-shadow: none; }
    button.ghost { background: #fff; color: #2e7d32; border: 2px solid #a5d6a7; box-shadow: none; }
    .hint { margin-top: .8rem; font-size: .95rem; color: #6d4c41; min-height: 1.4em; }
    .feedback { margin-top: .6rem; font-weight: 700; min-height: 1.6em; }
    .feedback.ok { color: #2e7d32; }
    .feedback.no { color: #c62828; }
    .shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .big-letter {
      font-size: 4rem; font-weight: 900; color: #1b5e20;
      background: #c5e1a5; border-radius: 20px;
      width: 110px; height: 110px; display: grid; place-items: center;
      margin: 0 auto 1rem;
      animation: pop .5s;
    }
    @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
    .treasure { font-size: 4rem; }
    .mascot { width: 170px; height: auto; }
    .speech { font-size: 1.05rem; background: #e8f5e9; border-radius: 14px; padding: .8rem 1rem; }
    #game { width: 100%; border-radius: 14px; border: 3px solid #a5d6a7; background: #bfe3f2; touch-action: none; }
    .hud { font-weight: 700; color: #558b2f; }
    .touch { display: flex; gap: .6rem; justify-content: center; margin-top: .6rem; }
    .touch button { font-size: 1.3rem; padding: .8rem 1.4rem; }
    .word { font-size: 2rem; font-weight: 900; letter-spacing: .3rem; color: #1b5e20; }
    footer { text-align: center; margin: 1.2rem 0; color: #689f38; font-size: .9rem; }
    .restart { margin-top: 1rem; }
    .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 99; animation: fall 3.5s linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    .scene { border: 3px solid #a5d6a7; border-radius: 20px; overflow: hidden; margin: 0 0 1rem; box-shadow: 0 6px 0 #c5e1a5; }
    .scene svg { display: block; width: 100%; height: auto; }
    .drift1 { animation: drift 46s linear infinite; }
    .drift2 { animation: drift 65s linear infinite; animation-delay: -20s; }
    .drift3 { animation: drift 56s linear infinite; animation-delay: -38s; }
    @keyframes drift { from { transform: translateX(-170px); } to { transform: translateX(710px); } }
    .ray-spin { transform-box: fill-box; transform-origin: center; animation: spin 48s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .birdfly1 { animation: flyacross 26s linear infinite; animation-delay: -6s; }
    .birdfly2 { animation: flyacross 34s linear infinite; animation-delay: -19s; }
    .birdfly3 { animation: flyacross 43s linear infinite; animation-delay: -30s; }
    @keyframes flyacross { from { transform: translate(-80px, 0); } to { transform: translate(720px, -16px); } }
    .bob { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .flapL { transform-box: fill-box; transform-origin: right center; animation: flap .55s ease-in-out infinite; }
    .flapR { transform-box: fill-box; transform-origin: left center; animation: flap .55s ease-in-out infinite; }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.25); } }
    .float1 { animation: floaty 7s ease-in-out infinite; }
    .float2 { animation: floaty 9s ease-in-out infinite; animation-delay: -3s; }
    .float3 { animation: floaty 8s ease-in-out infinite; animation-delay: -5s; }
    @keyframes floaty { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(26px, -20px); } 50% { transform: translate(52px, 0); } 75% { transform: translate(26px, 18px); } }
  </style>
</head>
<body>
  <div class="wrap">

          </g>
          <!-- passarinho no galho -->

            <line x1="0" y1="14" x2="0" y2="22" stroke="#4e342e" stroke-width="2"/>

            <rect x="-16" y="2" width="16" height="8" rx="4" transform="rotate(30)" fill="#1e88e5"/>

        <!-- ipê florido -->

          <circle cx="470" cy="258" r="5" fill="#fdd835"/>

    <div class="progress" id="progress" hidden>
      <div class="bar"><div id="barfill"></div></div>

    <main class="card" id="app"></main>

  <script>
    const STAGES = [
      {
        letter: "J",
        riddle: "Sou vermelhinha com bolinhas pretas, tenho asinhas e passeio pelas folhas. Quem sou eu?",
        answers: ["joaninha", "joaninhas"],
        hint: "Começa com a letra J e adora passear nas plantas. 🐞"
      },
      {
        letter: "A",
        riddle: "Faço zum-zum, tenho listras amarelas e pretas e fabrico um alimento bem docinho. Quem sou eu?",
        answers: ["abelha", "abelhas"],
        hint: "Começa com a letra A e mora numa colmeia. 🐝"
      },
      {
        letter: "R",
        riddle: "Sou uma flor muito cheirosa. Posso ser vermelha, branca ou cor-de-rosa, mas cuidado com meus espinhos!",
        answers: ["rosa", "rosas"],
        hint: "Começa com a letra R. 🌹"
      },
      {
        letter: "D",
        riddle: "Sou uma flor amarela que vira um pompom branquinho. As crianças me assopram e minhas sementinhas voam!",
        answers: ["dentedeleao"],
        hint: "Meu nome tem três partes e começa com D. É só escrever tudo junto! 🌼"
      },
      {
        letter: "I",
        riddle: "Sou uma árvore brasileira que perde as folhas e fica todinha florida: amarela, rosa ou roxa!",
        answers: ["ipe"],
        hint: "Começa com I e tem só 3 letrinhas. 🌳"
      },
      {
        letter: "M",
        riddle: "Moro na terra fofa e úmida, não tenho pernas e ajudo as plantas a crescer fortes e saudáveis!",
        answers: ["minhoca", "minhocas"],
        hint: "Começa com M e adora aparecer depois da chuva. 🪱"
      }
    ];
    const KEY = "caca-tesouro-helena-v1";

    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && typeof s.stage === "number" && Array.isArray(s.letters)) return s;
      } catch (e) { /* começa do zero */ }
      return { started: false, mode: "menu", stage: 0, letters: [], celebrate: null };
    }
    let state = load();
    if (!state.mode) state.mode = "menu";
    let rafId = null;
    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function norm(s) {
      return (s || "").toLowerCase()
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z]/g, "");
    }

    const app = document.getElementById("app");
    const progress = document.getElementById("progress");

    function renderProgress() {
      if (!state.started) { progress.hidden = true; return; }
      progress.hidden = false;
      document.getElementById("barfill").style.width = (state.letters.length / STAGES.length * 100) + "%";
      const box = document.getElementById("letters");
      box.innerHTML = "";
      for (let i = 0; i < STAGES.length; i++) {
        const d = document.createElement("div");
        d.className = "slot" + (state.letters[i] ? " found" : "");
        d.textContent = state.letters[i] || "?";
        box.appendChild(d);
      }
    }

    function render() {
      renderProgress();
      if (!state.started) return renderStart();
      if (state.mode === "play") return renderPlatform();
      if (state.celebrate) return renderSuccess();
      if (state.stage >= STAGES.length) return renderFinal();
      return renderStage();
    }

    function renderStart() {
      app.innerHTML = `
        <h2>🌳 Escolha sua aventura! 🌳</h2>
        <img class="mascot" src="exploradora.svg" alt="Helena, menina de cabelos enrolados com uniforme do Colégio Helena e All Star preto">
        <p class="speech">Oi! Eu sou a <strong>Helena</strong>, sua guia exploradora! 🧭</p>
        <p class="riddle">O <strong>Baú Verde</strong> do Colégio Helena está escondido!
        Decifre os <strong>6 enigmas da natureza</strong> ou jogue o
        <strong>Nível 1</strong>: pegue as moedas no caminho e conquiste a chave! 🗺️</p>
        <p><button id="goRiddles">🔍 Enigmas da Natureza</button></p>
        <p><button id="goPlay">🕹️ Nível 1: A Chave Perdida</button></p>`;
      document.getElementById("goRiddles").onclick = () => {
        state.mode = "riddles"; state.started = true; save(); render();
      };
      document.getElementById("goPlay").onclick = () => {
        state.mode = "play"; state.started = true; save(); render();
      };
    }

    function renderStage() {
      const s = STAGES[state.stage];
      app.innerHTML = `
        <p class="counter">🌱 Pista ${state.stage + 1} de ${STAGES.length} 🌱</p>
        <p class="riddle">${s.riddle}</p>
        <form id="form">
          <input type="text" id="answer" placeholder="Sua resposta..." autocomplete="off" aria-label="Sua resposta">
          <button type="submit">Responder ✅</button>
        </form>
        <p><button class="ghost" id="hintbtn">💡 Preciso de uma dica</button></p>
        <p class="hint" id="hint"></p>
        <p class="feedback" id="feedback"></p>
        <p class="restart"><button class="ghost" id="restart">🔄 Recomeçar</button></p>`;
      const input = document.getElementById("answer");
      input.focus();
      document.getElementById("hintbtn").onclick = () => {
        document.getElementById("hint").textContent = s.hint;
      };
      document.getElementById("restart").onclick = reset;
      document.getElementById("form").onsubmit = (e) => {
        e.preventDefault();
        const fb = document.getElementById("feedback");
        if (s.answers.includes(norm(input.value))) {
          state.letters.push(s.letter);
          state.stage++;
          state.celebrate = s.letter;
          save(); render();
        } else {
          fb.textContent = "Ops, tente de novo! Você consegue! 💪";
          fb.className = "feedback no";
          app.classList.remove("shake");
          void app.offsetWidth;
          app.classList.add("shake");
        }
      };
    }

    function renderSuccess() {
      app.innerHTML = `
        <h2>🎉 Resposta certa! 🎉</h2>
        <div class="big-letter">${state.celebrate}</div>
        <p>Você ganhou a letra <strong>${state.celebrate}</strong>!</p>
        <p><button id="next">${state.stage >= STAGES.length ? "Descobrir o tesouro! 🗝️" : "Próxima pista ➜"}</button></p>`;
      document.getElementById("next").onclick = () => {
        state.celebrate = null; save(); render();
      };
    }

    function renderFinal() {
      const word = state.letters.join("");
      app.innerHTML = `
        <div class="treasure">🎉🏆🎉</div>
        <h2>PARABÉNS, EXPLORADORES!</h2>
        <p>As letras secretas formam a palavra:</p>
        <p class="word">${word}</p>
        <p class="riddle">🗺️ O <strong>Baú Verde</strong> está escondido no
        <strong>JARDIM do Colégio Helena</strong>!
        Corram até lá com um adulto e procurem bem! 🌷🌻🌷</p>
        <p class="restart"><button id="again">🔄 Jogar de novo</button></p>`;
      document.getElementById("again").onclick = reset;
      confetti();
    }

    /* ---------- Nível 1: plataforma, moedas e chave ---------- */
    const WORLD_W = 1600;
    const PLATS = [
      { x: -40, y: 320, w: 460, h: 80 },
      { x: 520, y: 320, w: 480, h: 80 },
      { x: 620, y: 238, w: 110, h: 18 },
      { x: 790, y: 178, w: 110, h: 18 },
      { x: 960, y: 238, w: 110, h: 18 },
      { x: 1120, y: 320, w: 520, h: 80 },
      { x: 1400, y: 228, w: 130, h: 18 }
    ];
    const COIN_SPOTS = [
      [300, 272], [344, 252], [388, 252],
      [440, 222], [472, 202], [504, 222],
      [657, 204], [712, 204], [827, 144], [997, 204],
      [700, 286], [900, 286], [1200, 286], [1300, 286]
    ];
    const KEY_SPOT = { x: 1450, y: 188, w: 34, h: 32 };

    function stopLoop() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function toMenu() {
      stopLoop();
      state.started = false; state.mode = "menu"; save(); render();
    }

    function renderPlatform() {
      stopLoop();
      app.innerHTML = `
        <p class="counter">🕹️ Nível 1: A Chave Perdida 🗝️</p>
        <p class="hud" id="hud"></p>
        <canvas id="game" width="640" height="360"></canvas>
        <div class="touch">
          <button id="tL" aria-label="Andar para a esquerda">◀</button>
          <button id="tR" aria-label="Andar para a direita">▶</button>
          <button id="tJ" aria-label="Pular">⬆ PULAR</button>
        </div>
        <p class="restart"><button class="ghost" id="toMenu">🏠 Menu</button></p>`;
      document.getElementById("toMenu").onclick = toMenu;

      const cv = document.getElementById("game");
      const ctx = cv.getContext("2d");
      const W = 640, H = 360;
      const coins = COIN_SPOTS.map(([x, y]) => ({ x, y, got: false }));
      const p = { x: 40, y: 200, w: 26, h: 36, vx: 0, vy: 0, grounded: false, face: 1 };
      const keys = { left: false, right: false, jump: false };
      let got = 0, frame = 0, over = false;
      const hud = document.getElementById("hud");
      const showHud = () => { hud.textContent = `🪙 ${got}/${coins.length}  •  Chegue até a chave! ➡️`; };
      showHud();

      function bindBtn(id, prop) {
        const el = document.getElementById(id);
        const on = (e) => { e.preventDefault(); keys[prop] = true; };
        const off = (e) => { e.preventDefault(); keys[prop] = false; };
        el.addEventListener("pointerdown", on);
        el.addEventListener("pointerup", off);
        el.addEventListener("pointerleave", off);
        el.addEventListener("pointercancel", off);
      }
      bindBtn("tL", "left"); bindBtn("tR", "right"); bindBtn("tJ", "jump");

      function onKey(e, down) {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) e.preventDefault();
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = down;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = down;
        if ((e.key === "ArrowUp" || e.key === " " || e.key === "w") && down && !e.repeat) keys.jump = true;
        if ((e.key === "ArrowUp" || e.key === " " || e.key === "w") && !down) keys.jump = false;
      }
      const kd = (e) => onKey(e, true), ku = (e) => onKey(e, false);
      window.addEventListener("keydown", kd);
      window.addEventListener("keyup", ku);

      function overlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update() {
        p.vx = keys.left ? -3.6 : keys.right ? 3.6 : 0;
        if (p.vx !== 0) p.face = p.vx > 0 ? 1 : -1;
        p.vy = Math.min(p.vy + 0.55, 12);
        p.x = Math.max(0, Math.min(WORLD_W - p.w, p.x + p.vx));
        const prevBottom = p.y + p.h;
        p.y += p.vy;
        p.grounded = false;
        for (const pl of PLATS) {
          if (p.x + p.w > pl.x && p.x < pl.x + pl.w &&
              p.vy >= 0 && prevBottom <= pl.y + 1 && p.y + p.h >= pl.y) {
            p.y = pl.y - p.h; p.vy = 0; p.grounded = true;
          }
        }
        if (keys.jump && p.grounded) { p.vy = -12; p.grounded = false; keys.jump = false; }
        for (const c of coins) {
          if (!c.got && overlap(p, { x: c.x - 9, y: c.y - 9, w: 18, h: 18 })) {
            c.got = true; got++; showHud();
          }
        }
        if (!over && overlap(p, KEY_SPOT)) { over = true; win(); return; }
        if (p.y > 430) { p.x = 40; p.y = 200; p.vx = 0; p.vy = 0; }
      }

      function drawTree(x, y, s) {
        ctx.fillStyle = "#6d4c41";
        ctx.fillRect(x - 6 * s, y - 60 * s, 12 * s, 60 * s);
        ctx.fillStyle = "#1b5e20";
        ctx.beginPath(); ctx.arc(x, y - 80 * s, 30 * s, 0, 7); ctx.fill();
        ctx.fillStyle = "#2e7d32";
        ctx.beginPath(); ctx.arc(x - 8 * s, y - 88 * s, 22 * s, 0, 7); ctx.fill();
        ctx.fillStyle = "#66bb6a";
        ctx.beginPath(); ctx.arc(x - 12 * s, y - 96 * s, 10 * s, 0, 7); ctx.fill();
      }

      function drawPlayer(camX) {
        const x = p.x - camX, y = p.y;
        ctx.fillStyle = "#f6c391";
        ctx.fillRect(x + 6, y + 25, 6, 9);
        ctx.fillRect(x + 14, y + 25, 6, 9);
        ctx.fillStyle = "#222";
        ctx.fillRect(x + 4, y + 31, 9, 5);
        ctx.fillRect(x + 13, y + 31, 9, 5);
        ctx.fillStyle = "#1a2a6c";
        ctx.fillRect(x + 4, y + 19, 18, 8);
        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 4, y + 9, 18, 11);
        ctx.fillStyle = "#f6c391";
        ctx.fillRect(x + 1, y + 10, 3, 9);
        ctx.fillRect(x + 22, y + 10, 3, 9);
        ctx.beginPath(); ctx.arc(x + 13, y + 3, 8, 0, 7); ctx.fill();
        ctx.fillStyle = "#3d2314";
        ctx.beginPath(); ctx.arc(x + 13, y - 1, 8.5, Math.PI, 0); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 5, y + 2, 3.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 21, y + 2, 3.5, 0, 7); ctx.fill();
        ctx.fillStyle = "#222";
        ctx.fillRect(p.face > 0 ? x + 15 : x + 8, y + 2, 3, 4);
      }

      function draw() {
        frame++;
        const camX = Math.max(0, Math.min(WORLD_W - W, p.x + p.w / 2 - W / 2));
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#6fbfe8"); sky.addColorStop(1, "#eef9ee");
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fdd835";
        ctx.beginPath(); ctx.arc(560 - camX * 0.1, 52, 22, 0, 7); ctx.fill();
        ctx.fillStyle = "#9ccc65";
        ctx.beginPath(); ctx.ellipse(180 - camX * 0.4, 340, 260, 70, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#aed581";
        ctx.beginPath(); ctx.ellipse(560 - camX * 0.4, 345, 280, 72, 0, 0, 7); ctx.fill();
        drawTree(180 - camX, 300, 1);
        drawTree(760 - camX, 300, 0.8);
        drawTree(1300 - camX, 300, 1.1);
        for (const pl of PLATS) {
          const x = pl.x - camX;
          ctx.fillStyle = "#8d6e63"; ctx.fillRect(x, pl.y, pl.w, pl.h);
          ctx.fillStyle = "#43a047"; ctx.fillRect(x, pl.y, pl.w, 8);
        }
        for (const c of coins) {
          if (c.got) continue;
          const rx = 8 * Math.abs(Math.cos(frame / 14)) + 2;
          ctx.fillStyle = "#ffb300";
          ctx.beginPath(); ctx.ellipse(c.x - camX, c.y, rx, 9, 0, 0, 7); ctx.fill();
          ctx.fillStyle = "#ffe082";
          ctx.beginPath(); ctx.ellipse(c.x - camX, c.y, rx * 0.45, 5, 0, 0, 7); ctx.fill();
        }
        const bob = Math.sin(frame / 18) * 4;
        ctx.save();
        ctx.shadowColor = "#fdd835"; ctx.shadowBlur = 18;
        ctx.strokeStyle = "#ffb300"; ctx.lineWidth = 7; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(KEY_SPOT.x - camX, KEY_SPOT.y + bob, 9, 0, 7); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(KEY_SPOT.x - camX + 8, KEY_SPOT.y + bob + 4);
        ctx.lineTo(KEY_SPOT.x - camX + 26, KEY_SPOT.y + bob + 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(KEY_SPOT.x - camX + 21, KEY_SPOT.y + bob + 4);
        ctx.lineTo(KEY_SPOT.x - camX + 21, KEY_SPOT.y + bob + 11);
        ctx.moveTo(KEY_SPOT.x - camX + 26, KEY_SPOT.y + bob + 4);
        ctx.lineTo(KEY_SPOT.x - camX + 26, KEY_SPOT.y + bob + 9);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = "#6d4c41";
        ctx.fillRect(1560 - camX, 220, 6, 100);
        ctx.fillStyle = "#fff";
        ctx.fillRect(1566 - camX, 220, 44, 14);
        ctx.fillRect(1566 - camX, 234, 44, 14);
        ctx.fillStyle = "#222";
        ctx.fillRect(1566 - camX, 220, 11, 14);
        ctx.fillRect(1588 - camX, 220, 11, 14);
        ctx.fillRect(1577 - camX, 234, 11, 14);
        ctx.fillRect(1599 - camX, 234, 11, 14);
        drawPlayer(camX);
      }

      function win() {
        cleanup();
        app.innerHTML = `
          <div class="treasure">🗝️✨</div>
          <h2>VOCÊ PEGOU A CHAVE!</h2>
          <p class="riddle">A <strong>Chave do Baú Verde</strong> é sua!<br>
          Moedas coletadas: <strong>🪙 ${got}/${coins.length}</strong></p>
          <p><button id="again">🔄 Jogar de novo</button></p>
          <p><button id="goR" class="ghost">🔍 Ir para os Enigmas</button></p>
          <p class="restart"><button id="goM" class="ghost">🏠 Menu</button></p>`;
        document.getElementById("again").onclick = renderPlatform;
        document.getElementById("goR").onclick = () => {
          state.mode = "riddles"; state.started = true; save(); render();
        };
        document.getElementById("goM").onclick = toMenu;
      }

      function cleanup() {
        stopLoop();
        window.removeEventListener("keydown", kd);
        window.removeEventListener("keyup", ku);
      }
      const menuBtn = document.getElementById("toMenu");
      menuBtn.onclick = () => { cleanup(); toMenu(); };

      (function loop() {
        if (over) return;
        update();
        if (!over) { draw(); rafId = requestAnimationFrame(loop); }
      })();
    }

    function reset() {
      stopLoop();
      localStorage.removeItem(KEY);
      state = { started: false, mode: "menu", stage: 0, letters: [], celebrate: null };
      render();
    }

    function confetti() {
      const colors = ["#43a047", "#fdd835", "#fb8c00", "#e53935", "#1e88e5", "#8e24aa"];
      for (let i = 0; i < 70; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.animationDelay = (Math.random() * 1.5) + "s";
        c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5200);
      }
    }

    render();
  </script>
</body>
</html>
